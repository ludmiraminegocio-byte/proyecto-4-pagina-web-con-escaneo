<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador BENKA - IA & Voz</title>
    <style>
        /* ================= DISEÑO ESTILO BOUTIQUE ================= */
        :root {
            --fondo: #FFFCF9;
            --texto: #2C1F16;
            --gris-foto: #B3B3B3;
            --fuente-titulos: 'Georgia', serif;
            --fuente-textos: 'Helvetica Neue', Arial, sans-serif;
        }

        body { margin: 0; padding: 0; background-color: var(--fondo); color: var(--texto); font-family: var(--fuente-textos); }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #E0D8D0; }
        .logo { font-family: var(--fuente-titulos); font-size: 28px; font-weight: bold; letter-spacing: 2px; }
        
        .categorias { display: flex; gap: 15px; padding: 20px; overflow-x: auto; }
        .circulo-cat { width: 70px; height: 70px; background-color: var(--gris-foto); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; }
        .nombre-cat { background: black; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; text-align: center; margin-top: 5px; }

        .seccion-ingresos { padding: 20px; }
        .seccion-ingresos h2 { text-align: center; font-family: var(--fuente-titulos); color: #4A3B32; margin-bottom: 30px; }

        .grilla-productos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        /* TARJETA DE PRODUCTO Y CÁMARA */
        .producto-card { display: flex; flex-direction: column; gap: 8px; }
        .foto-placeholder { background-color: var(--gris-foto); aspect-ratio: 3/4; border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .foto-placeholder span { color: white; font-size: 60px; font-weight: 300; }
        .foto-placeholder img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* ETIQUETAS */
        .etiqueta-negra { background: black; color: white; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; width: fit-content; }
        .titulo-prod { background: black; color: white; }
        .precio-prod { background: black; color: white; }
        
        .contenedor-colores { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .etiqueta-colores { background: black; color: white; font-size: 10px; padding: 4px 8px; border-radius: 5px; font-weight: bold; }
        .circulo-color { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #ccc; }

        .btn-microfono { background: #E0D8D0; border: none; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 10px; width: 100%; transition: 0.3s; }
    </style>
</head>
<body>

    <header>
        <div>☰</div>
        <div class="logo">BENKA</div>
        <div>👤</div>
    </header>

    <div class="categorias">
        <div><div class="circulo-cat">✕</div><div class="nombre-cat">Categoría</div></div>
        <div><div class="circulo-cat">✕</div><div class="nombre-cat">Categoría</div></div>
    </div>

    <section class="seccion-ingresos">
        <h2>Nuevos ingresos</h2>
        
        <div class="grilla-productos">
            <!-- PRODUCTO 1 -->
            <div class="producto-card" id="prod-1">
                <!-- El input "capture" abre la cámara en el celular -->
                <label class="foto-placeholder">
                    <input type="file" accept="image/*" capture="environment" hidden onchange="procesarImagenConIA(this, 'prod-1')">
                    <span class="icono-cruz">✕</span>
                    <img class="preview-img" src="" alt="preview">
                </label>
                
                <div class="etiqueta-negra titulo-prod">Cargar foto...</div>
                <div class="etiqueta-negra precio-prod">$ ---</div>
                
                <div class="contenedor-colores">
                    <div class="etiqueta-colores">Colores disponibles</div>
                    <div class="lista-colores"></div>
                </div>

                <button class="btn-microfono" onclick="dictarPrecioYColores('prod-1')">
                    🎤 Dictar Precio y Color
                </button>
            </div>
            
             <!-- PRODUCTO 2 -->
             <div class="producto-card" id="prod-2">
                <label class="foto-placeholder">
                    <input type="file" accept="image/*" capture="environment" hidden onchange="procesarImagenConIA(this, 'prod-2')">
                    <span class="icono-cruz">✕</span>
                    <img class="preview-img" src="" alt="preview">
                </label>
                <div class="etiqueta-negra titulo-prod">Cargar foto...</div>
                <div class="etiqueta-negra precio-prod">$ ---</div>
                <div class="contenedor-colores">
                    <div class="etiqueta-colores">Colores disponibles</div>
                    <div class="lista-colores"></div>
                </div>
                <button class="btn-microfono" onclick="dictarPrecioYColores('prod-2')">
                    🎤 Dictar Precio y Color
                </button>
            </div>
        </div>
    </section>

    <script>
        // 1. VISIÓN ARTIFICIAL (Subir foto y obtener título)
        async function procesarImagenConIA(input, cardId) {
            if (input.files && input.files[0]) {
                const card = document.getElementById(cardId);
                const file = input.files[0];
                
                // Mostrar vista previa en la caja gris
                const reader = new FileReader();
                reader.onload = function(e) {
                    card.querySelector('.icono-cruz').style.display = 'none';
                    const img = card.querySelector('.preview-img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);

                // Enviar al servidor para analizar
                card.querySelector('.titulo-prod').innerText = "🤖 Analizando IA...";
                
                const formData = new FormData();
                formData.append('imagen', file);

                try {
                    const respuesta = await fetch('/api/analizar-imagen', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await respuesta.json();
                    
                    // Colocar el título detectado por la IA
                    card.querySelector('.titulo-prod').innerText = data.tituloGenerado;
                } catch (error) {
                    card.querySelector('.titulo-prod').innerText = "Error en IA";
                }
            }
        }

        // 2. RECONOCIMIENTO DE VOZ (Precio y Colores)
        function dictarPrecioYColores(cardId) {
            const card = document.getElementById(cardId);
            const btn = card.querySelector('.btn-microfono');
            
            const ReconocimientoVoz = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!ReconocimientoVoz) {
                alert("Tu navegador no soporta el dictado por voz. Usa Chrome en Android o Safari en iPhone.");
                return;
            }

            const reconocimiento = new ReconocimientoVoz();
            reconocimiento.lang = 'es-AR'; // Español
            
            reconocimiento.onstart = () => {
                btn.innerText = "🔴 Escuchando...";
                btn.style.background = "#ffcccc";
            };

            reconocimiento.onresult = (event) => {
                const texto = event.results[0][0].transcript.toLowerCase();
                console.log("El cliente dictó:", texto);
                
                // Extraer el precio (busca cualquier número dicho)
                const numeros = texto.match(/\d+/g);
                if (numeros) {
                    card.querySelector('.precio-prod').innerText = "$" + numeros.join("");
                }

                // Extraer colores
                const listaColores = card.querySelector('.lista-colores');
                listaColores.innerHTML = ""; // Limpiar anteriores
                
                const coloresDiccionario = {
                    "rosado": "#FFC0CB", "rosa": "#FFC0CB",
                    "celeste": "#ADD8E6", "azul": "#0000FF",
                    "verde": "#8FBC8F", "blanco": "#FFFFFF",
                    "negro": "#000000", "rojo": "#FF0000",
                    "beige": "#F5F5DC", "amarillo": "#FFD700"
                };

                for (let color in coloresDiccionario) {
                    if (texto.includes(color)) {
                        const circulo = document.createElement('div');
                        circulo.className = 'circulo-color';
                        circulo.style.backgroundColor = coloresDiccionario[color];
                        listaColores.appendChild(circulo);
                    }
                }

                btn.innerText = "🎤 ¡Dictado Exitoso!";
                btn.style.background = "#d4edda";
                setTimeout(() => { btn.innerText = "🎤 Dictar Precio y Color"; btn.style.background = "#E0D8D0"; }, 3000);
            };

            reconocimiento.start();
        }
    </script>
</body>
</html>
